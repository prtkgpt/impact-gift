version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: impact-gift-db
    environment:
      POSTGRES_DB: impact_gift
      POSTGRES_USER: impact_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impact_user -d impact_gift"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: backend
    container_name: impact-gift-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://impact_user:${DB_PASSWORD:-changeme}@postgres:5432/impact_gift
      JWT_SECRET: ${JWT_SECRET:-your-dev-jwt-secret-change-in-production}
      JWT_EXPIRES_IN: 7d
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend
    container_name: impact-gift-frontend
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: npm run dev

volumes:
  postgres_data:
