<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impact Gift - Donate to Charity Instead of Buying Gifts</title>

    <!-- Preconnect to API for faster data fetching -->
    <link rel="dns-prefetch" href="https://giftwithimpact.com" />
    <link rel="preconnect" href="https://giftwithimpact.com" crossorigin />

    <!-- Initial loading styles - shown before JS loads -->
    <style>
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .loader-content {
        text-align: center;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #f3f4f6;
        border-top-color: #9333ea;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loader-text {
        color: #6b7280;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-size: 14px;
      }

      /* Hide loader once React loads */
      .loaded #initial-loader {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Initial loading indicator -->
    <div id="initial-loader">
      <div class="loader-content">
        <div class="spinner"></div>
        <div class="loader-text">Loading Impact Gift...</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
