name: Keep Backend Alive

on:
  schedule:
    # Ping every 5 minutes to prevent cold starts
    - cron: '*/5 * * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "🔄 Pinging backend at $(date -u)"

          # Use the actual deployed backend URL
          BACKEND_URL="https://giftwithimpact.com"

          # Ping health endpoint
          response=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/health" || echo "000")

          if [ "$response" -eq 200 ]; then
            echo "✅ Backend is alive (HTTP $response)"
          else
            echo "⚠️ Backend returned HTTP $response"
          fi

      - name: Ping Main API Endpoint
        run: |
          echo "🔄 Pinging main API endpoint..."

          # Also ping a lightweight endpoint to keep database warm
          curl -s "https://giftwithimpact.com/api/charities?limit=1" > /dev/null || true

          echo "✅ Keep-alive ping completed"

