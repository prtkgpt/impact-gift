services:
  - type: web
    name: impact-gift-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run build
    preDeployCommand: cd backend && npm run migrate:prod
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
